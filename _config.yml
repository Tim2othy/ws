author: Timothy Currie

header_pages:
  - about.md
  - projects.md
  - setup.md
  - posts.md

# Build settings
markdown: kramdown
permalink: /:title/

# Collections
collections:
  drafts:
    output: true
    permalink: /drafts/:title/

# Exclude from build
exclude:
  - .git/
  - .gitignore
  - README.md
